# Nginx Reference Configuration for Umeed Local Image Storage
# 
# Since images are stored inside the backend at `backend/uploads/images/`,
# you can serve them directly via Nginx on your VPS for much better performance 
# than letting Node/Express serve them.

server {
    listen 80;
    server_name api.yourdomain.com; # Replace with actual domain

    # API Proxy
    location /api/ {
        proxy_pass http://localhost:5200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve Images Directly (Bypassing Node.js)
    # The /images/ route will match the URLs generated by our upload script
    location /images/ {
        # Absolute path to where the images are stored on your VPS
        alias /path/to/your/Umeed/B2B-umeed_custom/backend/uploads/images/;
        
        # Caching for performance
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # Allow CORS if needed by frontend
        add_header Access-Control-Allow-Origin *;
    }
}
